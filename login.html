<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Company Dashboard | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="login.css">
  <script defer src="login.js"></script>
</head>
<body>

  <div class="container">

    <!-- LEFT -->
    <div class="left-panel">
      <h1><a href=index.html>Company Dashboard</a></h1>
      <img src="logo.png" alt="logo company dashboard">
      <br>
      <p>Analysez, pilotez et optimisez votre entreprise grâce à des tableaux de bord intelligents.</p>
    </div>

    <!-- RIGHT -->
    <div class="right-panel">

      <!-- TOGGLE -->
      <div class="toggle">
        <button id="loginBtn" class="active">Se connecter</button>
        <button id="registerBtn">S'inscrire</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="form active">
        <h2>Connexion</h2>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Mot de passe" required>
        <button type="submit">Se connecter</button>
        <span class="forgot">Mot de passe oublié ?</span>
      </form>

      <!-- REGISTER FORM -->
      <form id="registerForm" class="form">
        <h2>Créer un compte</h2>
        <input type="text" placeholder="Nom complet" required>
        <input type="email" placeholder="Email professionnel" required>
        <input type="text" placeholder="Nom d'entreprise" required>
        <input type="password" placeholder="Mot de passe" required>
        <button type="submit">S'inscrire</button>
      </form>

    </div>
  </div>

</body>

</html>
